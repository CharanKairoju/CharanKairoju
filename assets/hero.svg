<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="380" fill="url(#grid)"/>
  </g>

  <!-- ==================== LEFT: Visual Motifs ==================== -->
  <g transform="translate(80, 40)">

    <!-- 1. VOICE AI WAVEFORMS (OutreachFlow) -->
    <g id="voiceAI" transform="translate(0, 0)">
      <text x="0" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#58a6ff" opacity="0.8">VOICE AI</text>
      <g transform="translate(0, 10)">
        <!-- Waveform bars -->
        <g filter="url(#glow)">
          <rect x="0" y="60" width="8" height="50" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="50;15;40;60;20;50" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="y" values="60;95;70;50;90;60" dur="1.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="16" y="60" width="8" height="30" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="30;55;20;45;60;30" dur="1.2s" repeatCount="indefinite" begin="0.1s"/>
            <animate attributeName="y" values="60;55;90;65;50;60" dur="1.2s" repeatCount="indefinite" begin="0.1s"/>
          </rect>
          <rect x="32" y="60" width="8" height="55" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="55;25;50;35;55" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
            <animate attributeName="y" values="55;85;60;75;55" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
          </rect>
          <rect x="48" y="60" width="8" height="25" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="25;60;30;50;25" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
            <animate attributeName="y" values="85;50;80;60;85" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
          </rect>
          <rect x="64" y="60" width="8" height="45" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="45;20;55;30;45" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
            <animate attributeName="y" values="65;90;55;80;65" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
          </rect>
          <rect x="80" y="60" width="8" height="35" fill="url(#waveGradient)" rx="2">
            <animate attributeName="height" values="35;50;25;40;35" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
            <animate attributeName="y" values="75;60;85;70;75" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- 2. MULTI-AGENT NODES (Hermes Swarm) -->
    <g id="multiAgent" transform="translate(0, 170)">
      <text x="0" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#3fb950" opacity="0.8">MULTI-AGENT</text>
      <g transform="translate(20, 20)">
        <!-- Three agent nodes: Architect, Developer, Reviewer -->
        <g filter="url(#softGlow)">
          <!-- Architect node -->
          <circle cx="0" cy="0" r="18" fill="#161b22" stroke="#3fb950" stroke-width="2" opacity="0.9">
            <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#3fb950">A</text>
          <text x="0" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8b949e">Architect</text>
        </g>

        <!-- Connection line 1 -->
        <line x1="18" y1="0" x2="62" y2="0" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
          <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
        </line>

        <!-- Developer node -->
        <g transform="translate(80, 0)" filter="url(#softGlow)">
          <circle cx="0" cy="0" r="18" fill="#161b22" stroke="#a371f0" stroke-width="2" opacity="0.9">
            <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
          </circle>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#a371f0">D</text>
          <text x="0" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8b949e">Developer</text>
        </g>

        <!-- Connection line 2 -->
        <line x1="98" y1="0" x2="142" y2="0" stroke="#a371f0" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
          <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite" begin="0.2s"/>
        </line>

        <!-- Reviewer node -->
        <g transform="translate(160, 0)" filter="url(#softGlow)">
          <circle cx="0" cy="0" r="18" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0.9">
            <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
          </circle>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="700" fill="#f0883e">R</text>
          <text x="0" y="28" text-anchor="middle" font-family="system-ui" font-size="8" fill="#8b949e">Reviewer</text>
        </g>

        <!-- Feedback loop arrow -->
        <path d="M 178,18 Q 190,-10 190,-30 Q 90,-50 -10,-30 Q -10,-10 0,18" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4">
          <animateTransform attributeName="transform" type="rotate" from="0 80 0" to="360 80 0" dur="8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER: Title & Description ==================== -->
  <g transform="translate(420, 80)">
    <!-- Main name -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#textGradient)" letter-spacing="-1.5">
      Charan Kairoju
    </text>

    <!-- Title line -->
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#e6edf3" letter-spacing="0.5">
      AI Engineer · MLOps · Cybersecurity · Full-Stack
    </text>

    <!-- Tagline -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" line-height="1.6">
      Building production-grade Voice AI, RAG, Multi-Agent systems & MLOps infrastructure
    </text>

    <!-- Stats pills -->
    <g transform="translate(0, 115)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="55" y="19" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#58a6ff">7 Internships</text>
      </g>
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="60" y="19" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#3fb950">6 Live Projects</text>
      </g>
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="55" y="19" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#a371f0">173 Emails Ready</text>
      </g>
    </g>

    <!-- Contact row -->
    <g transform="translate(0, 165)" font-family="system-ui" font-size="12" fill="#8b949e">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="8" r="8" fill="#58a6ff" opacity="0.2"/>
        <text x="25" y="13" fill="#58a6ff">github.com/CharanKairoju</text>
      </g>
      <g transform="translate(0, 28)">
        <circle cx="10" cy="8" r="8" fill="#0077B5" opacity="0.2"/>
        <text x="25" y="13" fill="#0077B5">linkedin.com/in/charankairoju</text>
      </g>
      <g transform="translate(0, 56)">
        <circle cx="10" cy="8" r="8" fill="#EA4335" opacity="0.2"/>
        <text x="25" y="13" fill="#EA4335">charankairoju@gmail.com</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: Project Proof Cards ==================== -->
  <g transform="translate(860, 40)">
    <!-- Card 1: OutreachFlow -->
    <g class="card" transform="translate(0, 0)">
      <rect x="0" y="0" width="300" height="75" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="20" r="10" fill="url(#waveGradient)" opacity="0.9" filter="url(#glow)"/>
      <text x="40" y="20" font-family="system-ui" font-size="12" font-weight="700" fill="#e6edf3">OutreachFlow AI</text>
      <text x="40" y="40" font-family="system-ui" font-size="10" fill="#8b949e">Voice AI · Twilio · Retell AI · n8n</text>
      <text x="40" y="58" font-family="system-ui" font-size="10" font-weight="600" fill="#3fb950">▶ Live Demo in Repo</text>
      <!-- Mini waveform -->
      <g transform="translate(180, 30)" filter="url(#glow)">
        <rect x="0" y="20" width="4" height="25" fill="#58a6ff" rx="1" opacity="0.8"/>
        <rect x="8" y="20" width="4" height="15" fill="#58a6ff" rx="1" opacity="0.6"/>
        <rect x="16" y="20" width="4" height="30" fill="#3fb950" rx="1" opacity="0.8"/>
        <rect x="24" y="20" width="4" height="12" fill="#58a6ff" rx="1" opacity="0.6"/>
        <rect x="32" y="20" width="4" height="22" fill="#3fb950" rx="1" opacity="0.8"/>
        <rect x="40" y="20" width="4" height="18" fill="#58a6ff" rx="1" opacity="0.6"/>
        <rect x="48" y="20" width="4" height="28" fill="#3fb950" rx="1" opacity="0.8"/>
      </g>
    </g>

    <!-- Card 2: Hermes Swarm -->
    <g class="card" transform="translate(0, 85)">
      <rect x="0" y="0" width="300" height="75" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="20" r="10" fill="url(#nodeGradient)" opacity="0.9" filter="url(#glow)"/>
      <text x="40" y="20" font-family="system-ui" font-size="12" font-weight="700" fill="#e6edf3">Hermes Swarm</text>
      <text x="40" y="40" font-family="system-ui" font-size="10" fill="#8b949e">Multi-Agent · FastAPI · React · OpenRouter</text>
      <text x="40" y="58" font-family="system-ui" font-size="10" font-weight="600" fill="#a371f0">▶ Live Demo in Repo</text>
      <!-- Mini nodes -->
      <g transform="translate(180, 30)">
        <circle cx="0" cy="0" r="6" fill="#3fb950" filter="url(#softGlow)">
          <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <line x1="10" y1="0" x2="25" y2="0" stroke="#3fb950" stroke-width="1.5" opacity="0.6"/>
        <circle cx="35" cy="0" r="6" fill="#a371f0" filter="url(#softGlow)">
          <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
        </circle>
        <line x1="45" y1="0" x2="60" y2="0" stroke="#a371f0" stroke-width="1.5" opacity="0.6"/>
        <circle cx="70" cy="0" r="6" fill="#f0883e" filter="url(#softGlow)">
          <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
        </circle>
      </g>
    </g>

    <!-- Card 3: LangGraph RAG -->
    <g class="card" transform="translate(0, 170)">
      <rect x="0" y="0" width="300" height="75" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="20" r="10" fill="#a371f0" opacity="0.9" filter="url(#glow)"/>
      <text x="40" y="20" font-family="system-ui" font-size="12" font-weight="700" fill="#e6edf3">LangGraph RAG</text>
      <text x="40" y="40" font-family="system-ui" font-size="10" fill="#8b949e">RAG · deepEval · n8n · pgvector</text>
      <text x="40" y="58" font-family="system-ui" font-size="10" font-weight="600" fill="#a371f0">▶ Live Demo in Repo</text>
      <!-- Mini doc chunks -->
      <g transform="translate(180, 25)">
        <rect x="0" y="0" width="22" height="28" rx="2" fill="#161b22" stroke="#a371f0" stroke-width="1" opacity="0.8"/>
        <text x="11" y="19" text-anchor="middle" font-family="system-ui" font-size="8" fill="#a371f0">0.94</text>
        <rect x="28" y="0" width="22" height="28" rx="2" fill="#161b22" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
        <text x="39" y="19" text-anchor="middle" font-family="system-ui" font-size="8" fill="#58a6ff">0.87</text>
        <rect x="56" y="0" width="22" height="28" rx="2" fill="#161b22" stroke="#3fb950" stroke-width="1" opacity="0.8"/>
        <text x="67" y="19" text-anchor="middle" font-family="system-ui" font-size="8" fill="#3fb950">0.91</text>
      </g>
    </g>

    <!-- Card 4: Gesture Mouse -->
    <g class="card" transform="translate(0, 255)">
      <rect x="0" y="0" width="300" height="75" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="20" r="10" fill="#f0883e" opacity="0.9" filter="url(#glow)"/>
      <text x="40" y="20" font-family="system-ui" font-size="12" font-weight="700" fill="#e6edf3">Gesture Mouse</text>
      <text x="40" y="40" font-family="system-ui" font-size="10" fill="#8b949e">MediaPipe · OpenCV · 96.5% · 0.18s</text>
      <text x="40" y="58" font-family="system-ui" font-size="10" font-weight="600" fill="#f0883e">▶ Live Demo in Repo</text>
      <!-- Mini hand landmarks -->
      <g transform="translate(190, 20)" stroke="#f0883e" stroke-width="1.5" opacity="0.7">
        <circle cx="0" cy="0" r="3" fill="#f0883e"/>
        <circle cx="20" cy="-10" r="3" fill="#f0883e"/>
        <circle cx="40" cy="0" r="3" fill="#f0883e"/>
        <circle cx="20" cy="10" r="3" fill="#f0883e"/>
        <line x1="0" y1="0" x2="20" y2="-10"/>
        <line x1="20" y1="-10" x2="40" y2="0"/>
        <line x1="40" y1="0" x2="20" y2="10"/>
        <line x1="20" y1="10" x2="0" y2="0"/>
      </g>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="80" y1="360" x2="1120" y2="360" stroke="url(#textGradient)" stroke-width="1" opacity="0.3"/>
</svg>